    <path d="m401 474-22 8-8 14 45-1 4-12Z" fill="#eab356"/>
    <path d="M370 499h57" fill="none"/>
  </g>
  <!-- Coral step-through bicycle, crank, fork, and swept handlebars. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m269 546 104-153 81 153H269l281-130-96 130" stroke="#243e43" stroke-width="15"/>
    <path d="m269 546 104-153 81 153H269l281-130-96 130" stroke="#ed7665" stroke-width="9"/>
    <path d="m540 384 115 162" stroke="#243e43" stroke-width="15"/>
    <path d="m540 384 115 162" stroke="#ed7665" stroke-width="9"/>
    <path d="m373 393-14-37m181 28-22-48 40-13q24-9 32 10" stroke="#243e43" stroke-width="9"/>
