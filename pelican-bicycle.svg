<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long golden bill pedals a coral bicycle against a pale mint circle.</desc>
  <defs>
    <g id="wheel">
      <circle r="111" fill="#fffdf5" stroke="#243e43" stroke-width="12"/>
      <circle r="98" fill="none" stroke="#c3d8d4" stroke-width="3"/>
      <g stroke="#a3bfbd" stroke-width="2.5">
        <path d="M-97 0H97M0-97V97M-69-69 69 69M-69 69 69-69M-90-37 90 37M-90 37 90-37M-37-90 37 90M-37 90 37-90"/>
      </g>
      <circle r="10" fill="#243e43"/>
    </g>
  </defs>
  <rect width="900" height="760" rx="36" fill="#fffdf5"/>
  <circle cx="442" cy="348" r="290" fill="#e2f0e6"/>
  <circle cx="699" cy="151" r="43" fill="#f7cf74"/>
  <g fill="none" stroke="#b6d3c7" stroke-width="6" stroke-linecap="round">
    <path d="M124 324h71m-98 28h67m-34 28h44"/>
    <path d="M697 371h57m-32 24h49"/>
  </g>
  <ellipse cx="462" cy="665" rx="312" ry="19" fill="#dce8dd"/>
  <g transform="translate(269 546)"><use href="#wheel"/></g>
  <g transform="translate(655 546)"><use href="#wheel"/></g>
