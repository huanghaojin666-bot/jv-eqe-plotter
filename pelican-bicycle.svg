  <circle cx="454" cy="546" r="25" fill="#fffdf5" stroke="#243e43" stroke-width="6"/>
  <circle cx="454" cy="546" r="7" fill="#ed7665"/>
  <path d="m454 546 40 33" fill="none" stroke="#243e43" stroke-width="7" stroke-linecap="round"/>
  <path d="M476 582h49" fill="none" stroke="#243e43" stroke-width="9" stroke-linecap="round"/>
  <!-- Tail, body, and the characteristic curved pelican neck. -->
  <g stroke="#243e43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m298 302-61-37 26 54-35-9q30 48 86 38" fill="#fdfcf5"/>
    <path d="M301 276q46-29 109-2 27-28 32-76-26-18-15-52 9-34 48-34 41 0 51 35 11 39-13 77-21 32-16 70 11 67-54 86-68 17-119-18-36-25-23-86Z" fill="#fffefa"/>
